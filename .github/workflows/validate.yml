name: Validate AM Med site

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  static-checks:
    name: Static site regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check site invariants
        run: node --test tests/site.test.mjs
